<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Forge — Free QR Code Generator</title>
<meta name="description" content="Generate beautiful QR codes instantly. Free, no sign-up, download as PNG.">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background: linear-gradient(135deg,#0f2027,#203a43,#2c5364); min-height:100vh; color:#fff; display:flex; flex-direction:column; align-items:center; padding:20px; }
  header { text-align:center; margin:30px 0; }
  header h1 { font-size:2.2rem; background:linear-gradient(90deg,#00d2ff,#928dff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p { color:#a8c0cc; margin-top:8px; }
  .card { background:rgba(255,255,255,.07); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.15); border-radius:20px; padding:28px; width:100%; max-width:480px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  label { display:block; margin:14px 0 6px; font-size:.9rem; color:#bfe3f0; }
  input[type=text], select { width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.3); color:#fff; font-size:1rem; }
  input[type=color] { width:100%; height:44px; border:none; border-radius:10px; background:none; cursor:pointer; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  button { width:100%; margin-top:20px; padding:14px; border:none; border-radius:12px; font-size:1.05rem; font-weight:700; cursor:pointer; background:linear-gradient(90deg,#00d2ff,#928dff); color:#0b1526; transition:transform .15s; }
  button:hover { transform:translateY(-2px); }
  #qrbox { margin-top:24px; display:flex; justify-content:center; padding:18px; background:#fff; border-radius:16px; }
  #dl { display:none; background:linear-gradient(90deg,#7fff9e,#00d2ff); }
  footer { margin-top:auto; padding:24px; color:#7b97a5; font-size:.85rem; text-align:center; }
  .ad { margin:24px 0; padding:16px; border:1px dashed rgba(255,255,255,.3); border-radius:12px; text-align:center; color:#9db8c4; font-size:.85rem; width:100%; max-width:480px; }
</style>
</head>
<body>
<header>
  <h1>⚡ QR Forge</h1>
  <p>Create custom QR codes instantly — free forever</p>
</header>

<div class="ad">📢 Ad Space — connect Google AdSense here to earn from visitors</div>

<div class="card">
  <label for="text">Text or URL</label>
  <input type="text" id="text" placeholder="https://your-link.com  or any text" value="https://example.com">

  <div class="row">
    <div>
      <label for="size">Size</label>
      <select id="size"><option value="256">256px</option><option value="512" selected>512px</option><option value="1024">1024px</option></select>
    </div>
    <div>
      <label for="ec">Error correction</label>
      <select id="ec"><option value="L">Low</option><option value="M" selected>Medium</option><option value="H">High</option></select>
    </div>
  </div>

  <div class="row">
    <div><label>QR color</label><input type="color" id="fg" value="#000000"></div>
    <div><label>Background</label><input type="color" id="bg" value="#ffffff"></div>
  </div>

  <button onclick="gen()">Generate QR Code</button>

  <div id="qrbox"><canvas id="cv"></canvas></div>
  <button id="dl" onclick="download()">⬇️ Download PNG</button>
</div>

<footer>Made with QR Forge · No sign-up · No watermark · 100% free</footer>

<script>
function gen(){
  const t=document.getElementById('text').value.trim();
  if(!t){alert('Enter text or URL first!');return;}
  const size=+document.getElementById('size').value;
  const ec=document.getElementById('ec').value;
  const fg=document.getElementById('fg').value, bg=document.getElementById('bg').value;
  const qr=qrcode(0,ec); qr.addData(t); qr.make();
  const n=qr.getModuleCount(), cell=Math.floor(size/n), pad=cell*2;
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  cv.width=cv.height=n*cell+pad*2;
  ctx.fillStyle=bg; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle=fg;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(qr.isDark(r,c)) ctx.fillRect(c*cell+pad,r*cell+pad,cell,cell);
  document.getElementById('dl').style.display='block';
}
function download(){
  const a=document.createElement('a');
  a.download='qrcode.png';
  a.href=document.getElementById('cv').toDataURL('image/png');
  a.click();
}
gen();
</script>
</body>
</html>
